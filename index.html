<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery - Professional Edition</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .gallery-columns { column-gap: 1rem; column-count: 2; }
        @media (min-width: 1024px) { .gallery-columns { column-count: 8; } }
        .waterfall-item { break-inside: avoid; margin-bottom: 1rem; transition: transform 0.2s; }
        .waterfall-item:hover { transform: translateY(-4px); }
        .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .tag-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; border-width: 1px; white-space: nowrap; }
        .tag-hot { background-color: #fff1f2; color: #be123c; border-color: #fecdd3; font-weight: bold; }
        .tag-default { background-color: #f9fafb; color: #6b7280; border-color: #f3f4f6; }

        .nav-section { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
        .fade-in-up { transition: all 0.3s ease; }

        /* Loading 旋转动画 */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow { animation: spin 1s linear infinite; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            const [rawData, setRawData] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedTag, setSelectedTag] = useState('');
            const [parentTag, setParentTag] = useState('');
            const [activeItem, setActiveItem] = useState(null);
            const [currentImgIndex, setCurrentImgIndex] = useState(0);
            const [isTitleExpanded, setIsTitleExpanded] = useState(false);
            const [isNavExpanded, setIsNavExpanded] = useState(false);
            const [showBackToTop, setShowBackToTop] = useState(false);
            const [isFiltering, setIsFiltering] = useState(false); // 控制加载动画
            const [loadStatus, setLoadStatus] = useState('Initializing...');
            const [displayCount, setDisplayCount] = useState(40); 

            const WHATSAPP_NUMBER = "85265426672"; 
            const PRIORITY_EXACT_TAGS = new Set(['Clothing', 'Bags', 'Shoes', 'Watches', 'Jewelry', 'Other', 'Hot Sale', 'Accessories']);

            const getTagClass = (tag) => {
                if (PRIORITY_EXACT_TAGS.has(tag)) return 'tag-hot';
                return 'tag-default';
            };

            const allTagsRaw = useMemo(() => {
                return [...new Set(rawData.flatMap(i => Array.isArray(i.标签) ? i.标签 : (i.标签 ? [i.标签] : [])))].filter(Boolean);
            }, [rawData]);

            // 监听 Hash 变化
            useEffect(() => {
                const handleHashChange = () => {
                    setIsFiltering(true); // 开始加载动画
                    
                    const hashText = decodeURIComponent(window.location.hash.replace('#', '')).trim();
                    
                    // 模拟一个 300ms 的处理延迟，让 Loading 效果可见且丝滑
                    setTimeout(() => {
                        if (!hashText) {
                            setSelectedTag('');
                            setParentTag('');
                        } else {
                            const matchedTag = allTagsRaw.find(t => t.toLowerCase() === hashText.toLowerCase());
                            const finalTag = matchedTag || hashText;
                            setSelectedTag(finalTag);
                            if (PRIORITY_EXACT_TAGS.has(finalTag)) {
                                setParentTag(finalTag);
                            }
                        }
                        setDisplayCount(40);
                        window.scrollTo(0, 0);
                        setIsFiltering(false); // 结束加载动画
                    }, 300);
                };
                
                if (rawData.length > 0) handleHashChange();
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, [rawData, allTagsRaw]);

            const updateTag = (tag) => { 
                window.location.hash = tag ? encodeURIComponent(tag) : ''; 
            };

            // 数据加载
            useEffect(() => {
                const fetchAllData = async () => {
                    try {
                        const resIndex = await fetch('./data_index.json');
                        const fileList = await resIndex.json();
                        for (let i = 0; i < fileList.length; i++) {
                            setLoadStatus(`Loading ${i + 1}/${fileList.length}...`);
                            const res = await fetch(`./${fileList[i]}`);
                            const chunk = await res.json();
                            setRawData(prev => [...prev, ...chunk]);
                        }
                        setLoadStatus('');
                    } catch (err) { console.error(err); }
                };
                fetchAllData();
            }, []);

            useEffect(() => {
                const handleScroll = () => {
                    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 800) {
                        setDisplayCount(prev => prev + 40);
                    }
                    setShowBackToTop(window.scrollY > 300);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

            const navGroups = useMemo(() => {
                const priority = allTagsRaw.filter(t => PRIORITY_EXACT_TAGS.has(t)).sort();
                let normalBaseTags = [];
                if (parentTag) {
                    const relatedItems = rawData.filter(item => {
                        const itemTags = Array.isArray(item.标签) ? item.标签 : (item.标签 ? [item.标签] : []);
                        return itemTags.includes(parentTag);
                    });
                    const relatedTags = [...new Set(relatedItems.flatMap(i => Array.isArray(i.标签) ? i.标签 : [i.标签]))];
                    normalBaseTags = relatedTags.filter(t => t !== parentTag && !PRIORITY_EXACT_TAGS.has(t));
                } else {
                    normalBaseTags = allTagsRaw.filter(t => !PRIORITY_EXACT_TAGS.has(t));
                }
                return { priority, normal: normalBaseTags.sort() };
            }, [allTagsRaw, rawData, parentTag]);

            const filteredItems = useMemo(() => {
                const q = searchQuery.toLowerCase().trim();
                return rawData.filter(item => {
                    const itemTags = Array.isArray(item.标签) ? item.标签 : (item.标签 ? [item.标签] : []);
                    const matchesSearch = q === '' || (item.标题 || "").toLowerCase().includes(q) || (item.货号 || "").toString().includes(q);
                    const matchesSelected = selectedTag === '' || itemTags.includes(selectedTag);
                    const matchesParent = parentTag === '' || itemTags.includes(parentTag);
                    return matchesSearch && matchesSelected && matchesParent;
                });
            }, [rawData, searchQuery, selectedTag, parentTag]);

            return (
                <div className="relative min-h-screen flex flex-col font-sans text-gray-900">
                    <header className="sticky top-0 z-40 glass-effect border-b border-gray-200 py-3 px-4">
                        <div className="max-w-[1920px] mx-auto flex items-center gap-4">
                            <div className="text-xl font-black tracking-tighter cursor-pointer shrink-0" onClick={() => updateTag('')}>
                                ALBUM<span className="text-pink-500">.</span>
                            </div>
                            <div className="relative flex-1">
                                <input 
                                    type="text" 
                                    placeholder={loadStatus || "Search..."} 
                                    className="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-400 text-sm focus:outline-none"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                />
                                <i className="fa fa-search absolute left-3 top-3 text-gray-400"></i>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-[1920px] mx-auto px-4 mt-6 flex-1 relative">
                        {/* 筛选时的 Loading 遮罩 */}
                        {isFiltering && (
                            <div className="fixed inset-0 z-30 bg-gray-50/50 backdrop-blur-[2px] flex items-center justify-center transition-opacity duration-300">
                                <div className="flex flex-col items-center gap-3">
                                    <div className="w-10 h-10 border-4 border-pink-200 border-t-pink-500 rounded-full animate-spin-slow"></div>
                                    <span className="text-xs font-bold text-pink-500 tracking-widest uppercase">Loading Collections</span>
                                </div>
                            </div>
                        )}

                        <div className="mb-6 flex flex-col gap-2">
                            <div className="nav-section">
                                <button onClick={() => updateTag('')} className={`px-4 py-1.5 rounded-full text-xs font-bold transition ${!parentTag ? 'bg-black text-white' : 'bg-gray-100 text-gray-600'}`}>
                                    ALL
                                </button>
                                {navGroups.priority.map(tag => (
                                    <button key={tag} onClick={() => updateTag(tag)} className={`px-4 py-1.5 rounded-full text-xs font-bold transition border ${parentTag === tag ? 'bg-pink-500 border-pink-500 text-white' : 'bg-white border-pink-200 text-pink-600'}`}>
                                        <i className="fa fa-star mr-1 text-[10px]"></i> {tag}
                                    </button>
                                ))}
                            </div>

                            {navGroups.normal.length > 0 && (
                                <div className="flex items-center gap-2 mt-1">
                                    <div className="flex-1 border-top border-gray-200 border-dashed border-t"></div>
                                    <button 
                                        onClick={() => setIsNavExpanded(!isNavExpanded)}
                                        className="text-[10px] font-bold text-pink-500 uppercase tracking-widest transition"
                                    >
                                        {isNavExpanded ? 'Show Less' : `Show More Collections (${navGroups.normal.length})`}
                                    </button>
                                    <div className="flex-1 border-top border-gray-200 border-dashed border-t"></div>
                                </div>
                            )}

                            <div className={`nav-section transition-all duration-300 overflow-hidden relative ${isNavExpanded ? 'max-h-[2000px]' : 'max-h-24'}`}>
                                {navGroups.normal.map(tag => (
                                    <button key={tag} onClick={() => updateTag(tag)} className={`px-3 py-1.5 rounded-md text-xs whitespace-nowrap transition border ${selectedTag === tag ? 'bg-black border-black text-white' : 'bg-white border-gray-200 text-gray-500 hover:border-gray-400'}`}>
                                        {tag}
                                    </button>
                                ))}
                                {!isNavExpanded && navGroups.normal.length > 8 && (
                                    <div className="absolute bottom-0 left-0 w-full h-8 bg-gradient-to-t from-gray-50 to-transparent pointer-events-none"></div>
                                )}
                            </div>
                        </div>

                        <div className={`gallery-columns transition-opacity duration-300 ${isFiltering ? 'opacity-20' : 'opacity-100'}`}>
                            {filteredItems.slice(0, displayCount).map(item => {
                                const itemTags = Array.isArray(item.标签) ? item.标签 : (item.标签 ? [item.标签] : []);
                                return (
                                    <div key={item.ID} onClick={() => { setActiveItem(item); setCurrentImgIndex(0); setIsTitleExpanded(false); }} className="waterfall-item bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden cursor-pointer">
                                        <div className="relative bg-gray-100">
                                            <img src={item.图片[0]} className="w-full h-auto block" loading="lazy" />
                                            <div className="absolute bottom-1 right-1 bg-black/50 text-white text-[10px] px-1.5 py-0.5 rounded">{item.图片?.length}P</div>
                                        </div>
                                        <div className="p-2 text-left">
                                            <p className="text-[10px] font-bold text-pink-600 truncate">{item.货号}</p>
                                            <h3 className="text-[11px] text-gray-700 line-clamp-1 mt-0.5 mb-2">{item.标题}</h3>
                                            <div className="flex flex-wrap gap-1">
                                                {itemTags.map(t => <span key={t} className={`tag-badge ${getTagClass(t)}`}>{t}</span>)}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>

                    {activeItem && (
                        <div className="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/95 transition-all" onClick={() => setActiveItem(null)}>
                            <div className="absolute top-0 w-full p-4 flex justify-between items-center z-50 text-white/80" onClick={e => e.stopPropagation()}>
                                <span className="text-sm font-mono">{currentImgIndex + 1} / {activeItem.图片.length}</span>
                                <button onClick={() => setActiveItem(null)} className="text-3xl p-2 hover:scale-110">
                                    <i className="fa fa-times"></i>
                                </button>
                            </div>

                            <div className="relative z-30 px-4 w-full h-full flex items-center justify-center overflow-hidden" onClick={e => e.stopPropagation()}>
                                <img src={activeItem.图片[currentImgIndex]} className="max-h-[70vh] md:max-h-[80vh] w-auto object-contain shadow-2xl" />
                                {activeItem.图片.length > 1 && (
                                    <div className="absolute inset-0 flex items-center justify-between px-2 pointer-events-none">
                                        <button onClick={(e) => { e.stopPropagation(); setCurrentImgIndex(prev => (prev - 1 + activeItem.图片.length) % activeItem.图片.length); }} className="w-10 h-10 rounded-full bg-black/20 text-white flex items-center justify-center pointer-events-auto hover:bg-white/10 transition">
                                            <i className="fa fa-chevron-left"></i>
                                        </button>
                                        <button onClick={(e) => { e.stopPropagation(); setCurrentImgIndex(prev => (prev + 1) % activeItem.图片.length); }} className="w-10 h-10 rounded-full bg-black/20 text-white flex items-center justify-center pointer-events-auto hover:bg-white/10 transition">
                                            <i className="fa fa-chevron-right"></i>
                                        </button>
                                    </div>
                                )}
                            </div>

                            <div className="absolute bottom-6 w-full flex flex-col items-center gap-4 z-40 px-6" onClick={e => e.stopPropagation()}>
                                <div className="bg-[#3335] backdrop-blur-sm px-4 py-2 rounded-xl text-white text-[13px] text-center font-light border border-white/10 max-w-[95%] cursor-pointer" onClick={() => setIsTitleExpanded(!isTitleExpanded)}>
                                    {isTitleExpanded ? (
                                        <span>{activeItem.标题} <span className="ml-2 text-pink-400 font-bold underline text-[11px]">Less</span></span>
                                    ) : (
                                        <span>{activeItem.标题.length > 50 ? activeItem.标题.substring(0, 50) + "..." : activeItem.标题}
                                        {activeItem.标题.length > 50 && <span className="ml-2 text-pink-400 font-bold underline text-[11px]">More</span>}</span>
                                    )}
                                </div>
                                <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent("Hi Sam, I'm interested in:\nItem: " + activeItem.货号 + "\n" + activeItem.标题)}`} target="_blank" className="bg-[#25D366] text-white px-8 py-2.5 rounded-full font-bold flex items-center gap-2 shadow-xl hover:scale-105 transition">
                                    <i className="fab fa-whatsapp text-xl"></i> Inquiry Now
                                </a>
                            </div>
                        </div>
                    )}

                    <div className="fixed bottom-6 right-6 z-40 flex flex-col gap-3">
                        <button onClick={scrollToTop} className={`w-14 h-14 rounded-full bg-white/90 backdrop-blur-md text-gray-600 flex items-center justify-center shadow-lg hover:scale-110 active:scale-95 transition-all fade-in-up border border-gray-200 ${showBackToTop ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10 pointer-events-none'}`}>
                            <i className="fa fa-arrow-up text-xl"></i>
                        </button>
                        <a href={`https://wa.me/${WHATSAPP_NUMBER}`} target="_blank" className="bg-[#25D366] text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl hover:scale-110 active:scale-95 transition-all">
                            <i className="fab fa-whatsapp text-3xl"></i>
                        </a>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
