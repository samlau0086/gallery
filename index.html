<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery - Fixed & Fast</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .gallery-columns { column-gap: 1rem; column-count: 2; }
        @media (min-width: 1024px) { .gallery-columns { column-count: 8; } }
        .waterfall-item { break-inside: avoid; margin-bottom: 1rem; transform: translateZ(0); background: white; border-radius: 0.5rem; overflow: hidden; border: 1px solid #f3f4f6; }
        .img-container { width: 100%; background-color: #f9fafb; position: relative; overflow: hidden; min-height: 150px; aspect-ratio: 1 / 1; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 0.3s ease-in; }
        .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
        .tag-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; border-width: 1px; white-space: nowrap; }
        .tag-hot { background-color: #fff1f2; color: #be123c; border-color: #fecdd3; font-weight: bold; }
        .tag-default { background-color: #f9fafb; color: #6b7280; border-color: #f3f4f6; }
        .nav-section { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin-fast { animation: spin 0.8s linear infinite; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            const [rawData, setRawData] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedTag, setSelectedTag] = useState('');
            const [parentTag, setParentTag] = useState('');
            const [activeItem, setActiveItem] = useState(null);
            const [currentImgIndex, setCurrentImgIndex] = useState(0);
            const [isNavExpanded, setIsNavExpanded] = useState(false);
            const [showBackToTop, setShowBackToTop] = useState(false);
            const [loadStatus, setLoadStatus] = useState('Checking...');
            const [displayCount, setDisplayCount] = useState(40); 

            const WHATSAPP_NUMBER = "85265426672"; 
            const BASE_ASSETS_URL = "https://assets.maesvanti.store/";
            const PRIORITY_EXACT_TAGS = new Set(['Clothing', 'Bags', 'Shoes', 'Watches', 'Jewelry', 'Other', 'Hot Sale', 'Accessories']);

            const _extractFilename = (url) => {
                if (!url) return "";
                return url.split('?')[0].split('/').pop();
            }

            const getWebpThumbnailUrl = (originalUrl, item) => {
                if (!originalUrl || !item?.source_json) return originalUrl;
                try {
                    const filename = _extractFilename(originalUrl);
                    const nameNoExt = filename.replace(/\.[^/.]+$/, "");
                    return `${BASE_ASSETS_URL}${item.source_json}_${item.货号}_${nameNoExt}.webp`;
                } catch (e) { return originalUrl; }
            };

            // 计算所有唯一标签
            const allTagsRaw = useMemo(() => {
                const tags = new Set();
                rawData.forEach(item => {
                    const itemTags = Array.isArray(item?.标签) ? item.标签 : (item?.标签 ? [item.标签] : []);
                    itemTags.forEach(t => tags.add(t));
                });
                return [...tags].filter(Boolean);
            }, [rawData]);

            // 计算分类分组 (补齐了之前丢失的部分)
            const navGroups = useMemo(() => {
                const priority = allTagsRaw.filter(t => PRIORITY_EXACT_TAGS.has(t)).sort();
                let normalBaseTags = [];
                if (parentTag) {
                    const relatedItems = rawData.filter(item => {
                        const tags = Array.isArray(item?.标签) ? item.标签 : (item?.标签 ? [item.标签] : []);
                        return tags.includes(parentTag);
                    });
                    const relatedTags = new Set();
                    relatedItems.forEach(i => {
                        const tags = Array.isArray(i?.标签) ? i.标签 : (i?.标签 ? [i.标签] : []);
                        tags.forEach(t => relatedTags.add(t));
                    });
                    normalBaseTags = [...relatedTags].filter(t => t !== parentTag && !PRIORITY_EXACT_TAGS.has(t));
                } else {
                    normalBaseTags = allTagsRaw.filter(t => !PRIORITY_EXACT_TAGS.has(t));
                }
                return { priority, normal: normalBaseTags.sort() };
            }, [allTagsRaw, rawData, parentTag]);

            // 过滤逻辑
            const filteredItems = useMemo(() => {
                const q = searchQuery.toLowerCase().trim();
                return rawData.filter(item => {
                    if (!item) return false;
                    const tags = Array.isArray(item.标签) ? item.标签 : (item.标签 ? [item.标签] : []);
                    const matchesSearch = !q || (item.标题 || "").toLowerCase().includes(q) || (item.货号 || "").toString().includes(q);
                    const matchesSelected = !selectedTag || tags.includes(selectedTag);
                    const matchesParent = !parentTag || tags.includes(parentTag);
                    return matchesSearch && matchesSelected && matchesParent;
                });
            }, [rawData, searchQuery, selectedTag, parentTag]);

            // 增量加载
            useEffect(() => {
                const fetchAllData = async () => {
                    try {
                        const resIndex = await fetch('./data_index.json');
                        const fileList = await resIndex.json();
                        for (let i = 0; i < fileList.length; i++) {
                            setLoadStatus(`Syncing (${i + 1}/${fileList.length})...`);
                            const res = await fetch(`./${fileList[i]}`);
                            const chunk = await res.json();
                            setRawData(prev => [...prev, ...(Array.isArray(chunk) ? chunk : [])]);
                        }
                        setLoadStatus('');
                    } catch (err) { setLoadStatus('Offline'); }
                };
                fetchAllData();
            }, []);

            // Hash 路由
            useEffect(() => {
                const handleHashChange = () => {
                    const hashText = decodeURIComponent(window.location.hash.replace('#', '')).trim();
                    if (!hashText) { setSelectedTag(''); setParentTag(''); }
                    else {
                        const matchedTag = allTagsRaw.find(t => t.toLowerCase() === hashText.toLowerCase()) || hashText;
                        setSelectedTag(matchedTag);
                        if (PRIORITY_EXACT_TAGS.has(matchedTag)) setParentTag(matchedTag);
                    }
                    setDisplayCount(40); window.scrollTo(0, 0);
                };
                if (rawData.length > 0) handleHashChange();
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, [rawData.length, allTagsRaw]);

            useEffect(() => {
                const handleScroll = () => {
                    if ((document.documentElement.scrollHeight - window.innerHeight - window.scrollY) < 600) {
                        setDisplayCount(prev => prev + 40);
                    }
                    setShowBackToTop(window.scrollY > 400);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="relative min-h-screen flex flex-col font-sans text-gray-900">
                    <header className="sticky top-0 z-40 glass-effect border-b border-gray-200 py-3 px-4">
                        <div className="max-w-[1920px] mx-auto flex items-center gap-4">
                            <div className="text-xl font-black tracking-tighter cursor-pointer shrink-0" onClick={() => window.location.hash=''}>
                                ALBUM<span className="text-pink-500">.</span>
                            </div>
                            <div className="relative flex-1">
                                <input 
                                    type="text" 
                                    placeholder={loadStatus || "Search items..."} 
                                    className="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-400 text-sm focus:outline-none bg-white/50"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                />
                                <i className={`fa ${loadStatus ? 'fa-circle-notch animate-spin text-pink-400' : 'fa-search text-gray-400'} absolute left-3 top-3`}></i>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-[1920px] mx-auto px-4 mt-6 flex-1">
                        <div className="mb-6 flex flex-col gap-2">
                            <div className="nav-section">
                                <button onClick={() => window.location.hash=''} className={`px-4 py-1.5 rounded-full text-xs font-bold transition ${!parentTag ? 'bg-black text-white' : 'bg-gray-100 text-gray-600'}`}>ALL</button>
                                {navGroups.priority.map(tag => (
                                    <button key={tag} onClick={() => window.location.hash=tag} className={`px-4 py-1.5 rounded-full text-xs font-bold transition border ${parentTag === tag ? 'bg-pink-500 border-pink-500 text-white' : 'bg-white border-pink-200 text-pink-600'}`}>
                                        {tag}
                                    </button>
                                ))}
                            </div>
                            {navGroups.normal.length > 0 && (
                                <button onClick={() => setIsNavExpanded(!isNavExpanded)} className="text-[10px] font-bold text-gray-400 py-2 border-y border-gray-100 border-dashed my-1">
                                    {isNavExpanded ? 'HIDE COLLECTIONS' : `SHOW MORE COLLECTIONS (${navGroups.normal.length})`}
                                </button>
                            )}
                            <div className={`nav-section transition-all overflow-hidden ${isNavExpanded ? 'max-h-[1000px] opacity-100 py-2' : 'max-h-0 opacity-0'}`}>
                                {navGroups.normal.map(tag => (
                                    <button key={tag} onClick={() => window.location.hash=tag} className={`px-3 py-1.5 rounded-md text-xs border ${selectedTag === tag ? 'bg-black text-white border-black' : 'bg-white text-gray-500 border-gray-200'}`}>
                                        {tag}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="gallery-columns">
                            {filteredItems.slice(0, displayCount).map(item => (
                                <div key={item.ID || Math.random()} onClick={() => { setActiveItem(item); setCurrentImgIndex(0); }} className="waterfall-item cursor-pointer hover:shadow-md transition-shadow">
                                    <div className="img-container">
                                        <img src={getWebpThumbnailUrl(item.图片?.[0], item)} loading="lazy" onLoad={(e) => e.target.style.opacity = 1} style={{ opacity: 0 }} />
                                        <div className="absolute bottom-1 right-1 bg-black/40 backdrop-blur-sm text-white text-[9px] px-1.5 py-0.5 rounded">{item.图片?.length}P</div>
                                    </div>
                                    <div className="p-2">
                                        <p className="text-[10px] font-bold text-pink-600 uppercase">{item.货号}</p>
                                        <h3 className="text-[11px] text-gray-700 line-clamp-1 mt-0.5">{item.标题}</h3>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {(displayCount < filteredItems.length || loadStatus) && (
                            <div className="py-20 text-center text-gray-300 text-[10px] tracking-widest uppercase">
                                {loadStatus ? "Updating Database..." : "End of results"}
                            </div>
                        )}
                    </main>

                    {activeItem && (
                        <div className="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/95" onClick={() => setActiveItem(null)}>
                            <div className="absolute top-0 w-full p-4 flex justify-between items-center text-white/50" onClick={e => e.stopPropagation()}>
                                <span className="text-xs font-mono">{currentImgIndex + 1} / {activeItem.图片?.length}</span>
                                <button onClick={() => setActiveItem(null)} className="text-2xl p-2"><i className="fa fa-times"></i></button>
                            </div>
                            <div className="relative w-full h-full flex items-center justify-center p-4" onClick={e => e.stopPropagation()}>
                                <img src={activeItem.图片?.[currentImgIndex]} className="max-h-full max-w-full object-contain shadow-2xl" />
                                {activeItem.图片?.length > 1 && (
                                    <div className="absolute inset-x-4 flex justify-between pointer-events-none">
                                        <button onClick={() => setCurrentImgIndex(p => (p - 1 + activeItem.图片.length) % activeItem.图片.length)} className="w-12 h-12 rounded-full bg-white/5 text-white pointer-events-auto hover:bg-white/10 transition"><i className="fa fa-chevron-left"></i></button>
                                        <button onClick={() => setCurrentImgIndex(p => (p + 1) % activeItem.图片.length)} className="w-12 h-12 rounded-full bg-white/5 text-white pointer-events-auto hover:bg-white/10 transition"><i className="fa fa-chevron-right"></i></button>
                                    </div>
                                )}
                            </div>
                            <div className="absolute bottom-8 w-full flex flex-col items-center gap-4 px-6" onClick={e => e.stopPropagation()}>
                                <div className="text-white/80 text-xs text-center max-w-md line-clamp-2 px-4 py-2 bg-white/5 rounded-lg border border-white/10">
                                    {activeItem.标题}
                                </div>
                                <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent("Inquiry: " + activeItem.货号)}`} target="_blank" className="bg-[#25D366] text-white px-10 py-3 rounded-full font-bold flex items-center gap-2 shadow-lg">
                                    <i className="fab fa-whatsapp text-xl"></i> WhatsApp Sam
                                </a>
                            </div>
                        </div>
                    )}

                    <div className="fixed bottom-6 right-6 z-40 flex flex-col gap-3">
                        {showBackToTop && (
                            <button onClick={() => window.scrollTo({top:0, behavior:'smooth'})} className="w-12 h-12 rounded-full bg-white shadow-xl flex items-center justify-center text-gray-400 border border-gray-100 transition-all">
                                <i className="fa fa-arrow-up"></i>
                            </button>
                        )}
                        <a href={`https://wa.me/${WHATSAPP_NUMBER}`} target="_blank" className="bg-[#25D366] text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl hover:scale-110 transition-all">
                            <i className="fab fa-whatsapp text-3xl"></i>
                        </a>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
